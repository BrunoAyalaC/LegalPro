# nginx.conf (frontend production)
# Generado por @devops

upstream legalpro_node {
  least_conn;
  server legalpro-node.railway.internal:3001;
  keepalive 32;
}

upstream legalpro_dotnet {
  least_conn;
  server legalpro-dotnet.railway.internal:5000;
  keepalive 32;
}

upstream legalpro_owner {
  server legalpro-owner.railway.internal:3005;
  keepalive 16;
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

# Connection limit
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
  listen 80;
  server_name legalpro.pe www.legalpro.pe;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:; media-src 'self'; object-src 'none'; frame-ancestors 'self';" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # HTTPS redirect
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name legalpro.pe www.legalpro.pe;

  ssl_certificate /etc/nginx/ssl/legalpro.crt;
  ssl_certificate_key /etc/nginx/ssl/legalpro.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

  # SPA root
  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA
  location /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Auth endpoints (Node) - rate limit
  location ~ ^/api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://legalpro_node;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  # Other Node endpoints
  location ~ ^/api/(organizaciones|expedientes|documentos|mis-datos|datos-personales) {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://legalpro_node;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  # .NET endpoints (IA, contadores)
  location ~ ^/api/(analista|jurisprudencia|redactor|predictor|casos|objeciones|interrogatorio|alegatos|chat|plazos|resumen|multidoc|boveda|simulacion|notificaciones) {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://legalpro_dotnet;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_read_timeout 60s;
  }

  # Owner dashboard (subdominio o path)
  location /owner/ {
    proxy_pass http://legalpro_owner/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Connection limit
  limit_conn conn_per_ip 50;
}
