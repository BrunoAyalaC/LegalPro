server {
    listen 3000;
    charset utf-8;
    root /app/dist;
    index index.html;

    # ── Compresión ──
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/webp font/woff2;
    gzip_min_length 256;
    gzip_vary on;

    # ── Security Headers (refuerzo fuera de Helmet) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ── Forzar HTTPS ──
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ── Assets estáticos — cache agresivo ──
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Landing ──
    location /landing/ {
        try_files $uri $uri/ /landing/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── SPA — todas las rutas a index.html ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
}
